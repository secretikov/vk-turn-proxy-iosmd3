name: Build Expo iOS App (IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: vk-client/package-lock.json

    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: npm ci
      working-directory: vk-client

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }} # Only needed if you want EAS, but we use prebuild locally

    - name: Prebuild iOS project
      run: npx expo prebuild --platform ios --clean
      working-directory: vk-client

    - name: Aggressive clean
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
        rm -rf ~/Library/Caches/CocoaPods || true
        cd vk-client/ios
        rm -rf Pods Podfile.lock
        rm -rf .xcode.env .xcode.env.local
      working-directory: .

    - name: Setup CocoaPods
      run: |
        pod repo update
        pod deintegrate || true
        pod install --repo-update --verbose
      working-directory: vk-client/ios

    - name: Build and archive
      run: |
        xcodebuild archive \
          -workspace vkclient.xcworkspace \
          -scheme vkclient \
          -configuration Release \
          -archivePath $PWD/build/vkclient.xcarchive \
          -sdk iphoneos \
          -derivedDataPath $PWD/build/DerivedData \
          -verbose \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
      working-directory: vk-client/ios

    - name: Export IPA
      run: |
        mkdir -p Payload
        cp -r build/vkclient.xcarchive/Products/Applications/vkclient.app Payload/
        zip -r vkclient.ipa Payload
        rm -rf Payload
      working-directory: vk-client/ios

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vkclient.ipa
        path: vk-client/ios/vkclient.ipa
